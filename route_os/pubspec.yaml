name: route_app_frontend
description: Distribution Route Management App — Production Ready
publish_to: 'none'
version: 2.1.0+2

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  flutter_map: ^7.0.2
  # 0.22.x supports the JDK 17 toolchain used by this Android project.
  maplibre_gl: ^0.22.0
  latlong2: ^0.9.1
  intl: ^0.20.2
  google_fonts: ^6.2.1
  flutter_secure_storage: ^9.2.4
  flutter_polyline_points: ^2.1.0
  # ── Production additions ──────────────────────────────────
  image_picker: ^1.1.2          # Camera & gallery for delivery photos
  syncfusion_flutter_signaturepad: ^27.1.48  # E-signature capture
  url_launcher: ^6.3.0          # Open Google Maps for navigation
  cached_network_image: ^3.4.1  # Cache delivery photos
  collection: ^1.18.0           # firstOrNull, etc.
  geolocator: ^13.0.4           # High-accuracy GPS for live tracking
  percent_indicator: ^4.2.4     # Animated circular/linear progress

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/routeos_logo.png
